name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      # Decode the signing keystore and write the properties file Gradle reads
      # (src-tauri/gen/android/build.gradle.kts -> rootProject.file("keystore.properties")).
      # Without a keystore the release build type produces an UNSIGNED apk that
      # will not install, so fail early with a clear message if the secret is missing.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in the repo's Actions secrets."
            exit 1
          fi
          keystore_path="$GITHUB_WORKSPACE/src-tauri/gen/android/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          cat > "$GITHUB_WORKSPACE/src-tauri/gen/android/keystore.properties" <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEYSTORE_PASSWORD
          storeFile=$keystore_path
          EOF

      - name: Build Android release APK
        run: bun run tauri android build --apk
        env:
          CI: "true"
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: grindr-joseba-release-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
