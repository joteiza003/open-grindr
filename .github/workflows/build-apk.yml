name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show system information
        shell: bash
        run: |
          echo "=========================================="
          echo "SYSTEM"
          echo "=========================================="

          echo "OS:"
          lsb_release -a || true

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Architecture:"
          uname -m

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show Bun version
        run: |
          echo "Bun:"
          bun --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show Rust version
        run: |
          echo "Rust:"
          rustc --version

          echo ""
          echo "Cargo:"
          cargo --version

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show Java version
        run: |
          echo "Java:"
          java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Inspect Android environment
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not set}"

          echo ""
          echo "sdkmanager:"
          command -v sdkmanager || true

          echo ""
          echo "adb:"
          command -v adb || true

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed || true

      - name: Inspect repository
        shell: bash
        run: |
          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          echo "Working directory:"
          pwd

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f \
            | grep -v "^./.git/" \
            | sort \
            | head -n 250

      - name: Verify package.json
        shell: bash
        run: |
          echo "=========================================="
          echo "PACKAGE.JSON"
          echo "=========================================="

          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          echo "package.json found."

          echo ""
          echo "Available scripts:"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

            for (const [name, command] of Object.entries(pkg.scripts || {})) {
              console.log(`  ${name}: ${command}`);
            }
          '

      - name: Install dependencies
        run: |
          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          bun install --frozen-lockfile

      - name: Inspect Tauri configuration
        shell: bash
        run: |
          echo "=========================================="
          echo "TAURI CONFIGURATION"
          echo "=========================================="

          if [ -f "src-tauri/tauri.conf.json" ]; then
            echo "Found:"
            echo "src-tauri/tauri.conf.json"
            echo ""
            cat src-tauri/tauri.conf.json

          elif [ -f "src-tauri/tauri.conf.json5" ]; then
            echo "Found:"
            echo "src-tauri/tauri.conf.json5"
            echo ""
            cat src-tauri/tauri.conf.json5

          elif [ -f "src-tauri/tauri.conf.jsonc" ]; then
            echo "Found:"
            echo "src-tauri/tauri.conf.jsonc"
            echo ""
            cat src-tauri/tauri.conf.jsonc

          else
            echo "ERROR: Tauri configuration file not found."
            exit 1
          fi

      - name: Inspect Rust toolchain
        shell: bash
        run: |
          echo "=========================================="
          echo "RUST TOOLCHAIN"
          echo "=========================================="

          if [ -f "rust-toolchain.toml" ]; then
            echo "Found rust-toolchain.toml:"
            echo ""
            cat rust-toolchain.toml
          elif [ -f "rust-toolchain" ]; then
            echo "Found rust-toolchain:"
            echo ""
            cat rust-toolchain
          else
            echo "No rust-toolchain file found."
          fi

      - name: Verify Android project
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          if [ ! -d "src-tauri/gen/android" ]; then
            echo "ERROR:"
            echo "src-tauri/gen/android does not exist."

            echo ""
            echo "src-tauri contents:"
            find src-tauri -maxdepth 4 -type f | sort | head -n 500

            exit 1
          fi

          echo "Android project found."

          echo ""
          echo "Android project structure:"
          find src-tauri/gen/android \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -n 500

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          echo "=========================================="
          echo "GRADLE WRAPPER"
          echo "=========================================="

          if [ ! -f "src-tauri/gen/android/gradlew" ]; then
            echo "ERROR: Android Gradle wrapper not found:"
            echo "src-tauri/gen/android/gradlew"
            exit 1
          fi

          chmod +x src-tauri/gen/android/gradlew

          echo "Gradle wrapper:"
          ls -lh src-tauri/gen/android/gradlew

      - name: Show Tauri CLI version
        shell: bash
        run: |
          echo "=========================================="
          echo "TAURI CLI"
          echo "=========================================="

          bun run tauri --version

      - name: Validate Android project
        shell: bash
        run: |
          echo "=========================================="
          echo "ANDROID GRADLE VALIDATION"
          echo "=========================================="

          cd src-tauri/gen/android

          ./gradlew --version

      - name: Build Android APK
        shell: bash
        run: |
          echo "=========================================="
          echo "TAURI ANDROID BUILD"
          echo "=========================================="

          echo "Build command:"
          echo "bun run tauri android build"

          echo ""

          bun run tauri android build
        env:
          CI: "true"

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          echo ""
          echo "APK files found:"
          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print \
            | sort

          APK=$(find src-tauri/gen/android \
            -type f \
            -name "*.apk" \
            -print \
            | sort \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: No APK was generated."

            echo ""
            echo "Android build outputs:"
            find src-tauri/gen/android \
              -type f \
              \( \
                -name "*.apk" \
                -o -name "*.aab" \
              \) \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "APK selected:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: APK information
        shell: bash
        run: |
          echo "=========================================="
          echo "APK INFORMATION"
          echo "=========================================="

          APK="${{ steps.apk.outputs.apk_path }}"

          echo "File:"
          echo "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

      - name: Prepare APK artifact
        id: artifact
        shell: bash
        run: |
          echo "=========================================="
          echo "PREPARING ARTIFACT"
          echo "=========================================="

          APK="${{ steps.apk.outputs.apk_path }}"

          SHORT_SHA="${GITHUB_SHA::7}"
          DATE=$(date -u +"%Y%m%d-%H%M")

          OUTPUT="OpenGrind-custom-${DATE}-${SHORT_SHA}.apk"

          cp "$APK" "$OUTPUT"

          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Artifact:"
          ls -lh "$OUTPUT"

      - name: Calculate final SHA256
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL CHECKSUM"
          echo "=========================================="

          APK="${{ steps.artifact.outputs.output }}"

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenGrind-custom-${{ github.sha }}
          path: ${{ steps.artifact.outputs.output }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          APK="${{ steps.artifact.outputs.output }}"
          SHA256=$(sha256sum "$APK" | cut -d ' ' -f 1)

          {
            echo "## Android APK build"
            echo ""
            echo "Build completed successfully."
            echo ""
            echo "**Repository:** \`${GITHUB_REPOSITORY}\`"
            echo ""
            echo "**Branch:** \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**APK:** \`${APK}\`"
            echo ""
            echo "**SHA256:** \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
