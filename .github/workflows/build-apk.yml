name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configurar Node.js (usando una versión más reciente para evitar warnings)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Configurar pnpm (Open Grind suele utilizar pnpm para la gestión del monorepo/frontend)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      # 3. Configurar Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 4. Configurar Java 17 para Android
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # 5. Instalar dependencias usando pnpm (resuelve el error del lock file faltante)
      - name: Install dependencies
        run: pnpm install

      # 6. Compilar Tauri para Android
      - name: Build Tauri Android
        run: |
          pnpm tauri android build
        env:
          CI: "true"

      # 7. Subir el APK resultante
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
            src-tauri/target/android/release/apk/*.apk
