name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show Bun version
        run: bun --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show Java version
        run: java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Tauri CLI
        run: bun run tauri --version

      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "ERROR: src-tauri/gen/android does not exist."
            exit 1
          fi

          echo "Android project found."
          find src-tauri/gen/android -maxdepth 2 -type f \
            \( -name "gradlew" -o -name "build.gradle*" -o -name "settings.gradle*" \) \
            -print

      - name: Build Android Debug APK
        run: bun run build:android:debug
        env:
          CI: "true"

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK=$(find src-tauri/gen/android \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo ""
            echo "Files inside Android build directory:"
            find src-tauri/gen/android -type f | sort
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        id: artifact
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.apk_path }}"

          SHORT_SHA="${GITHUB_SHA::7}"
          DATE=$(date -u +"%Y%m%d-%H%M")

          OUTPUT="OpenGrind-custom-debug-${DATE}-${SHORT_SHA}.apk"

          cp "$APK" "$OUTPUT"

          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo "Prepared APK:"
          ls -lh "$OUTPUT"

      - name: Calculate SHA256
        shell: bash
        run: |
          sha256sum "${{ steps.artifact.outputs.output }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGrind-custom-debug-${{ github.sha }}
          path: ${{ steps.artifact.outputs.output }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          APK="${{ steps.artifact.outputs.output }}"
          SHA256=$(sha256sum "$APK" | cut -d ' ' -f 1)

          echo "## Android APK build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK:** \`${APK}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**SHA256:** \`${SHA256}\`" >> "$GITHUB_STEP_SUMMARY"
